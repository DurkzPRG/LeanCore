name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build (compile check without Hytale jar)
        run: |
          mkdir -p "$HOME/.local/share/Hytale/install/release/package/game/latest/Server"
          touch "$HOME/.local/share/Hytale/install/release/package/game/latest/Server/HytaleServer.jar"
          ./gradlew build --no-daemon -x javadoc
        continue-on-error: true
